<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MobilixStore - Gestão Completa para Lojas | Mobilix</title>
<style>
  :root {
    --azul-escuro: #0D2E6E;
    --azul-claro: #2557C7;
    --amarelo: #FFCC00;
    --cinza: #7A8EBA;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, Arial, sans-serif; background: #F0F4FF; color: #1a1a1a; }
  .header { background: linear-gradient(180deg, var(--azul-escuro), var(--azul-claro)); padding: 60px 20px; text-align: center; color: #fff; }
  .logo { display: inline-block; background: var(--amarelo); color: var(--azul-escuro); font-weight: 900; font-size: 28px; padding: 14px 24px; border-radius: 16px; margin-bottom: 16px; }
  .header h1 { font-size: 32px; margin-bottom: 8px; }
  .header p { color: var(--amarelo); font-size: 15px; letter-spacing: 1px; text-transform: uppercase; }
  .container { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }
  .beneficios { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 50px; }
  .beneficio { background: #fff; border-radius: 12px; padding: 20px; border: 1px solid #E2E8F8; }
  .beneficio-icone { font-size: 28px; margin-bottom: 8px; }
  .beneficio h3 { color: var(--azul-escuro); font-size: 15px; margin-bottom: 6px; }
  .beneficio p { color: var(--cinza); font-size: 13px; line-height: 1.5; }
  .titulo-planos { text-align: center; color: var(--azul-escuro); font-size: 24px; font-weight: 900; margin-bottom: 8px; }
  .subtitulo-planos { text-align: center; color: var(--cinza); font-size: 14px; margin-bottom: 32px; }
  .planos-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; max-width: 950px; margin: 0 auto; }
  .plano-card { background: #fff; border-radius: 20px; padding: 32px 28px; text-align: center; box-shadow: 0 10px 40px rgba(13, 46, 110, 0.08); border: 2px solid transparent; position: relative; }
  .plano-card.destaque { border-color: var(--amarelo); transform: scale(1.03); }
  .plano-selo { position: absolute; top: -13px; left: 50%; transform: translateX(-50%); background: var(--amarelo); color: var(--azul-escuro); font-size: 11px; font-weight: 900; padding: 5px 16px; border-radius: 20px; text-transform: uppercase; }
  .plano-nome { color: var(--azul-escuro); font-size: 19px; font-weight: 900; margin-bottom: 6px; }
  .plano-desc { color: var(--cinza); font-size: 13px; margin-bottom: 20px; min-height: 34px; }
  .plano-preco { font-size: 36px; font-weight: 900; color: var(--azul-escuro); margin-bottom: 2px; }
  .plano-preco span { font-size: 14px; font-weight: 400; color: var(--cinza); }
  .plano-parcelamento { color: var(--cinza); font-size: 12px; margin-bottom: 22px; }
  .btn-comprar { display: block; width: 100%; padding: 15px; background: var(--amarelo); color: var(--azul-escuro); border: none; border-radius: 12px; font-size: 15px; font-weight: 900; cursor: pointer;
